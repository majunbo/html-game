<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级玛丽</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", sans-serif;
  overflow: hidden;
  user-select: none;
}
#game-container {
  position: relative;
  width: 1100px;
  height: 650px;
  background: #87CEEB;
  border: 4px solid #333;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
  color: #fff;
  z-index: 10;
  text-align: center;
}
.screen h1 {
  font-size: 56px;
  margin-bottom: 20px;
  text-shadow: 4px 4px 0 #e94560, 0 0 20px rgba(233,69,96,0.5);
  letter-spacing: 4px;
}
.screen h2 {
  font-size: 36px;
  margin-bottom: 16px;
  color: #ffd700;
}
.screen p {
  font-size: 18px;
  line-height: 1.8;
  margin: 6px 0;
  color: #eee;
}
.btn {
  margin-top: 28px;
  padding: 14px 48px;
  font-size: 22px;
  font-family: inherit;
  font-weight: 700;
  background: linear-gradient(180deg, #e94560, #c23152);
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 6px 0 #8b1e3a, 0 8px 20px rgba(0,0,0,0.3);
  transition: all 0.1s;
}
.btn:hover, .btn:focus {
  transform: translateY(2px);
  box-shadow: 0 4px 0 #8b1e3a, 0 6px 15px rgba(0,0,0,0.3);
  outline: none;
}
.btn:active {
  transform: translateY(6px);
  box-shadow: 0 0 0 #8b1e3a;
}
.ops {
  background: rgba(255,255,255,0.08);
  padding: 20px 40px;
  border-radius: 12px;
  margin: 16px 0;
  text-align: left;
}
.ops p { font-size: 16px; }
/* 左上角游戏名称 + 版本 */
#gameTitle {
  position: absolute; top: 14px; left: 16px; z-index: 6;
  color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 1px;
  text-shadow: 2px 2px 0 #000, 0 0 12px rgba(0,0,0,.45);
  pointer-events: none; white-space: nowrap;
}
#gameTitle .ver { color: #ffd700; font-size: 13px; font-weight: 700; margin-left: 4px; }
/* 右上角 FPS：数字时钟 LCD 风格（小号数字） */
#fpsCounter {
  position:absolute; top:56px; right:14px; z-index:6;
  font-family:"Consolas","Courier New",monospace; font-size:11px; font-weight:700;
  letter-spacing:2px; color:#8dffb9;
  background:#04140a; border:1px solid #0f3d22; border-radius:4px;
  padding:3px 8px; text-shadow:0 0 6px rgba(70,255,150,.85);
  box-shadow:inset 0 0 6px rgba(0,255,120,.14);
  font-variant-numeric:tabular-nums; pointer-events:none;
}
/* 右上角控制栏：暂停 / 重新开始 / 语言切换 */
#topBar { position:absolute; top:14px; right:14px; z-index:30; display:flex; gap:8px; align-items:center; }
.ctrl-btn {
  font-family:"Microsoft YaHei","微软雅黑",Arial,sans-serif;
  font-size:13px; font-weight:700; letter-spacing:1px; color:#fff;
  background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.55);
  border-radius:6px; padding:6px 12px; cursor:pointer;
  text-shadow:1px 1px 0 #000;
  transition:background .15s ease, transform .15s ease, opacity .15s ease;
}
.ctrl-btn:hover:not(:disabled) { background:rgba(0,0,0,.62); transform:translateY(-1px); }
.ctrl-btn:disabled { opacity:.4; cursor:default; }
#pauseScreen { background:rgba(10,16,38,.78); }
#hud {
  position: absolute;
  top: 58px;
  left: 0;
  right: 0;
  padding-right: 300px;
  display: flex;
  justify-content: space-around;
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  text-shadow: 2px 2px 0 #000;
  z-index: 5;
  pointer-events: none;
}
.hidden { display: none !important; }

/* 页面底部 GitHub 链接 & 语言选择 */
.game-footer {
  margin-top: 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px 12px;
  font-size: 14px;
  color: #aab4d4;
  letter-spacing: .5px;
}
.game-footer .footer-dot { opacity: .6; }
.game-footer a {
  color: #7fb3ff; text-decoration: none; font-weight: 600;
  transition: color .15s ease, text-shadow .15s ease;
}
.game-footer a:hover { color: #b3d7ff; text-shadow: 0 0 10px rgba(127,179,255,.8); }
.game-footer .lang-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 999px;
  padding: 3px 12px 3px 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  transition: all .2s ease;
}
.game-footer .lang-wrap:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(127, 179, 255, 0.6);
  box-shadow: 0 4px 14px rgba(0,0,0,0.3), 0 0 12px rgba(127,179,255,0.35);
}
.game-footer .lang-icon { font-size: 14px; line-height: 1; user-select: none; }
.game-footer .lang-select {
  font-family: "Microsoft YaHei","微软雅黑",Arial,sans-serif;
  font-size: 13px; font-weight: 600; color: #e2e8f0; background: transparent;
  border: 0; padding: 2px 0; cursor: pointer; outline: none; text-shadow: 1px 1px 2px rgba(0,0,0,.6);
}
.game-footer .lang-select option { color: #1a1a2e; background: #fff; text-shadow: none; }

/* 过关惊喜彩带 */
#confettiBox { position:absolute; inset:0; overflow:hidden; border-radius:8px; pointer-events:none; }
#confettiBox i {
  position:absolute; top:-14px; width:8px; height:13px; opacity:.92; border-radius:2px;
  animation: confFall linear forwards;
}
@keyframes confFall { to { transform: translateY(720px) rotate(760deg); } }
#luckyMsg { color:#ffd700; font-weight:800; font-size:20px; text-shadow:0 0 12px rgba(255,215,0,.55); }

/* 语言切换已移至底部页脚 */
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="1100" height="650"></canvas>
  <div id="hud" class="hidden">
    <span data-i18n="score">积分：<span id="scoreText">0</span></span>
    <span data-i18n="level">关卡：<span id="levelText">1</span></span>

  <div id="fpsCounter" class="fps-counter">FPS --</div>

  <div id="topBar">
    <button id="btnTopPause" class="ctrl-btn" type="button">⏸ 暂停</button>
    <button id="btnTopRestart" class="ctrl-btn" type="button">↻ 重新开始</button>

  <div id="startScreen" class="screen">
    <h1>超级玛丽</h1>
    <div class="ops">
      <p>← → 或 A D ：左右移动</p>
      <p>空格 / W / ↑ ：跳跃</p>

      <p>到达终点红旗即可过关</p>
    </div>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <h2 id="pauseTitle">游戏暂停</h2>
    <p id="pauseText">休息一下，马里奥在等你回来。</p>
    <button class="btn" id="btnResume">继续游戏</button>
    <button class="btn" id="btnPauseRestart" style="margin-top:12px;background:linear-gradient(180deg,#4a90d9,#2a6cb0);box-shadow:0 6px 0 #1a4a80;">重新开始</button>
    <p id="pauseHint" style="font-size:14px;color:#aab4d4;margin-top:22px;">按 P 或 Esc 继续游戏</p>
  </div>

  <div id="levelClearScreen" class="screen hidden">
    <h2>恭喜通关！</h2>
    <div id="confettiBox"></div>
    <p id="clearMsg">本关积分 +0</p>
    <p id="luckyMsg">惊喜奖励 +0</p>
    <p>当前总分：<span id="clearScore">0</span></p>
    <button class="btn" id="nextBtn">进入下一关</button>
  </div>

  <div id="failScreen" class="screen hidden">
    <h2>再接再厉！</h2>
    <p>别灰心，失败是成功之母！</p>
    <p>当前积分：<span id="failScore">0</span></p>
    <button class="btn" id="retryBtn">重新挑战本关</button>
    <button class="btn" id="restartBtn" style="margin-top:12px;background:linear-gradient(180deg,#4a90d9,#2a6cb0);box-shadow:0 6px 0 #1a4a80;">回到第一关</button>
  </div>

  <div id="winScreen" class="screen hidden">
    <h1>全部通关！</h1>
    <h2>太厉害了！</h2>
    <p>最终积分：<span id="winScore">0</span></p>
    <button class="btn" id="winRestartBtn">再玩一次</button>
  </div>
</div>
<div class="game-footer">
  <span>超级玛丽 Grok Fast 生成 v5</span>
  <span class="footer-dot">·</span>
  <span>GitHub：<a href="https://github.com/majunbo/html-game" target="_blank" rel="noopener">majunbo/html-game</a></span>
  <span class="footer-dot">·</span>
  <div class="lang-wrap">
    <span class="lang-icon" aria-hidden="true">🌐</span>
    <select id="langSelect" class="lang-select" aria-label="Language / 语言">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="pt-BR">Português</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
    </select>
  </div>
</div>

const JUMP_FORCE = -14.2;
const JUMP_FORCE_RUN = -17.0;
const MOVE_SPEED = 4.2;
const RUN_SPEED = 7.5;
// 跳坑手感宽容度（平台游戏标准做法）
const COYOTE_FRAMES = 6;      // 土狼时间：走出坑沿后仍可起跳的帧数
const JUMP_BUFFER_FRAMES = 6; // 跳跃预输入：落地前提前按键，落地瞬间自动起跳
const LEDGE_SNAP = 18;        // 低于地面此高度内且脚未悬空时，自动“扒住坑沿”站回地面

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type='square', vol=0.15) {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function playCoin() { playTone(880,0.1); setTimeout(()=>playTone(1200,0.15),80); }
function playJump() { playTone(400,0.12,'triangle',0.1); }
function playStomp() { playTone(200,0.15,'sawtooth',0.12); }
function playFlag() {
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,0.25,'triangle',0.18),i*180));
}
function playHurt() { playTone(150,0.3,'sawtooth',0.2); }

function detectLang(){
  const list=[].concat(navigator.languages||[],[navigator.language||'en']);
  const s=list.join(',').toLowerCase();
  if(s.indexOf('zh')>=0)return /tw|hk|mo|hant/.test(s)?'zh-TW':'zh-CN';
  if(s.indexOf('ja')>=0)return 'ja';
  if(s.indexOf('pt')>=0)return 'pt-BR';
  if(s.indexOf('es')>=0)return 'es';
  if(s.indexOf('fr')>=0)return 'fr';
  return 'en';
}

function seededRand(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function buildLevelV5(cfg){
  const R=seededRand(cfg.seed);
  const pits=[],pipes=[],bricks=[],questions=[],enemies=[],coins=[],platforms=[];
  // 开场教学砖阵 + 第一枚金币
  bricks.push({x:260,y:400},{x:340,y:400});
  questions.push({x:300,y:400});
  coins.push({x:320,y:330});
  // 特征序列：砖阵 / 管道均匀插在坑之间，形成“跳坑 → 遇敌 → 攀砖阵”的节奏
  const others=[];
  const otherTotal=cfg.clusterCount+cfg.pipeCount;
  for(let j=0;j<otherTotal;j++)others.push(j%3===2?'pipe':'cluster');
  const feats=[];let oi=0;
  for(let j=0;j<cfg.pitCount;j++){
    const per=Math.floor(otherTotal/cfg.pitCount)+(j<otherTotal%cfg.pitCount?1:0);
    for(let k=0;k<per&&oi<others.length;k++)feats.push(others[oi++]);
    feats.push('pit');
  }
  while(oi<others.length)feats.push(others[oi++]);
  let x=560,platLeft=cfg.platforms;
  const endX=cfg.width-520;   // 终点前留出安全区
  for(const f of feats){
    if(x>endX)break;
    if(f==='pit'){
      const w=cfg.pitW[0]+Math.floor(R()*(cfg.pitW[1]-cfg.pitW[0]+1));
      if(x+w>endX)break;
      pits.push({x,w});
      const cx=x+w/2;                        // 坑上金币弧线：沿跳跃轨迹顺手收集
      coins.push({x:cx-36,y:GROUND_Y-118},{x:cx,y:GROUND_Y-148},{x:cx+36,y:GROUND_Y-118});
      enemies.push({x:x+w+48,dir:-1});       // ★ 每个坑的落点必配一只守卫板栗仔
      if(platLeft>0&&w>=110&&R()<0.65){      // 宽坑上放移动平台，多一条惊险路线
        platforms.push({cx:x+w/2,y:GROUND_Y-150,w:110,h:16,range:w/2+80,speed:0.011+R()*0.009,t:R()*6.28});
        platLeft--;
      }
      x+=w+130+R()*80;
    }else if(f==='pipe'){
      const h=80+Math.floor(R()*61);
      pipes.push({x,h});
      enemies.push({x:x+84,dir:-1});         // 管道前再放一只巡逻板栗仔
      x+=56+130+R()*80;
    }else{
      const n=3+Math.floor(R()*4);           // 3~6 块砖
      if(x+n*40>endX)break;
      const y=cfg.rows[Math.floor(R()*cfg.rows.length)];
      const kind=R();
      if(kind<0.42){                          // 平排砖阵（中间嵌问号）
        const qi=Math.floor(n/2);
        for(let i=0;i<n;i++){if(i!==qi)bricks.push({x:x+i*40,y});}
        questions.push({x:x+qi*40,y});
        coins.push({x:x+n*20,y:y-56});
      }else if(kind<0.62){                    // 上行阶梯（顶端是问号）
        const sy=y<=400?440:400,steps=Math.min(n,3);
        for(let i=0;i<steps;i++){if(i<steps-1)bricks.push({x:x+i*40,y:sy-i*40});}
        questions.push({x:x+(steps-1)*40,y:sy-(steps-1)*40});
        coins.push({x:x+(steps-1)*40+20,y:sy-(steps-1)*40-56});
      }else if(kind<0.82){                    // 金字塔砖阵（塔顶嵌问号）
        const base=Math.max(4,n+1);
        const topR2=Math.min(2,Math.floor(base/2)-1);
        const qcol=topR2+Math.floor((base-topR2*2)/2);   // 问号所在列（相对偏移）
        for(let r2=0;r2*2<base&&r2<3;r2++){
          const cnt=base-r2*2;
          for(let i=0;i<cnt;i++){
            if(r2===topR2&&(r2+i)===qcol)continue;       // 该格留给问号
            bricks.push({x:x+(r2+i)*40,y:440-r2*40});
          }
        }
        questions.push({x:x+qcol*40,y:440-topR2*40});
        coins.push({x:x+Math.floor(base/2)*40+20,y:440-topR2*40-56});
      }else{                                  // 双层砖阵：上层问号要先跳上下层才顶得到
        const qLow=Math.floor(n/2);
        const un=Math.max(2,n-2),ux=Math.floor((n-un)/2);
        const qUp=ux+Math.floor(un/2);
        for(let i=0;i<n;i++){if(i!==qLow)bricks.push({x:x+i*40,y:400});}
        for(let i=0;i<un;i++){if(ux+i!==qUp)bricks.push({x:x+(ux+i)*40,y:280});}
        questions.push({x:x+qLow*40,y:400});
        if(R()<0.6)questions.push({x:x+qUp*40,y:280});
        else bricks.push({x:x+qUp*40,y:280});
        coins.push({x:x+n*20,y:280-56});
      }
      x+=Math.max(n,4)*40+120+R()*90;
    }
  }
  return {
    width:cfg.width,theme:LEVEL_THEMES[cfg.theme],enemySpeed:cfg.enemySpeed,
    name:'第 '+cfg.index+' 关 · '+LEVEL_THEMES[cfg.theme].name,
    bricks,questions,enemies,pits,pipes,coins,platforms,flagX:cfg.width-300
  };
}

function initLevel(lv) {
  currentLevel = lv;
  levelData = levels[lv-1];
  bricks = levelData.bricks.map(b => ({x:b.x, y:b.y, w:40, h:40}));
  questions = levelData.questions.map(q => ({x:q.x, y:q.y, w:40, h:40, hit:false, bump:0, flash:0}));
  enemies = levelData.enemies.map(e => ({
    x:e.x, y:GROUND_Y-32, w:32, h:32, vx: e.dir * levelData.enemySpeed, alive:true, squished:false, squishTimer:0, turnCooldown:0, frame:0
  }));
  pipes = levelData.pipes.map(p => ({x:p.x, y:GROUND_Y-p.h, w:56, h:p.h}));
  pits = levelData.pits.map(p => ({x:p.x, y:GROUND_Y, w:p.w, h:H-GROUND_Y}));
  coins = levelData.coins.map(c => ({x:c.x, y:c.y, taken:false}));
  platforms = (levelData.platforms||[]).map(p => ({baseX:p.cx, y:p.y, w:p.w, h:p.h, range:p.range, speed:p.speed, t:p.t, x:p.cx - p.w/2}));
  mario.standingPlat = null;
  levelFrame = 0;

  // 防止敌人出生点落在管道内部。
  // 第二关的敌人 x=1000，而管道 x=980~1036，原来会直接生成在管道里，
  // 每一帧检测到重叠后又反转方向，于是敌人看起来像“卡死”。
  for (const e of enemies) {
    for (const p of pipes) {
      if (!rectsCollide(e, p)) continue;
      if (e.vx < 0) {
        e.x = p.x - e.w - 1;
      } else {
        e.x = p.x + p.w + 1;
      }
    }
  }
  flag = { x: levelData.flagX, poleH: 220, flagY: 0, falling: false };
  flagScoreGiven = false;
  marioOnFlag = false;
  mario.x = 80; mario.y = GROUND_Y - 48;
  mario.vx = 0; mario.vy = 0; mario.onGround = true;
  mario.facing = 1; mario.invincible = 0;
  cameraX = 0;
  particles = []; floatingTexts = [];
  document.getElementById('levelText').textContent = lv;
  document.getElementById('scoreText').textContent = score;
  document.getElementById('livesText').textContent = lives;
}

function drawMario(x, y, facing, frame, pose) {
  ctx.save();
  if (facing < 0) { ctx.translate(x + 16, y); ctx.scale(-1,1); x = -16; y = 0; }
  else { ctx.translate(x, y); x=0; y=0; }
  ctx.fillStyle = '#e52521';
  ctx.fillRect(4, 2, 24, 10);
  ctx.fillRect(2, 8, 28, 6);
  ctx.fillStyle = '#fce4b8';
  ctx.fillRect(6, 12, 20, 14);
  ctx.fillStyle = '#000';
  ctx.fillRect(18, 14, 5, 5);
  ctx.fillStyle = '#6b3a1f';
  ctx.fillRect(14, 22, 12, 4);
  ctx.fillStyle = '#e52521';
  ctx.fillRect(6, 26, 20, 12);
  // 走路 / 跳跃 / 站立 三种姿态：不动时完全静止，只有移动和腾空才有动画
  const jump = pose === 'jump';
  const legOff = pose === 'walk' ? (Math.floor(frame) % 2 === 0 ? 0 : 3) : 0;
  if (jump) { ctx.fillStyle = '#e52521'; ctx.fillRect(24, 14, 9, 7); }  // 跳跃举手
  ctx.fillStyle = '#1e3a8a';
  if (jump) {
    ctx.fillRect(6, 38, 9, 9);
    ctx.fillRect(17, 38, 9, 9);
  } else {
    ctx.fillRect(6, 38, 9, 10 + legOff);
    ctx.fillRect(17, 38, 9, 10 - legOff);
  }
  ctx.fillStyle = '#6b3a1f';
  ctx.fillRect(4, 46, 12, 4);
  ctx.fillRect(16, 46, 12, 4);
  ctx.restore();
}

function drawBrick(x, y) {
  const th = levelData.theme;   // 每关砖块配色都不一样
  ctx.fillStyle = th.brick;
  ctx.fillRect(x, y, 40, 40);
  ctx.strokeStyle = th.brickLo;
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, 40, 40);
  ctx.beginPath();
  ctx.moveTo(x, y+20); ctx.lineTo(x+40, y+20);
  ctx.moveTo(x+20, y); ctx.lineTo(x+20, y+20);
  ctx.moveTo(x+10, y+20); ctx.lineTo(x+10, y+40);
  ctx.moveTo(x+30, y+20); ctx.lineTo(x+30, y+40);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(x+2, y+2, 36, 4);
  ctx.fillStyle = th.brickHi;
  ctx.fillRect(x+22, y+22, 14, 5);
}

function drawQuestion(x, y, hit, bump = 0, flash = 0) {
  // bump: 0 → -8 → 0，形成“被顶起再回弹”的效果
  const offsetY = bump;
  const dy = y + offsetY;

  ctx.save();

  if (hit) {
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(x, dy, 40, 40);
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, dy, 40, 40);
  } else {
    const g = ctx.createLinearGradient(x, dy, x, dy+40);
    g.addColorStop(0, '#ffd700');
    g.addColorStop(1, '#e6a800');
    ctx.fillStyle = g;
    ctx.fillRect(x, dy, 40, 40);
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, dy, 40, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px "Microsoft YaHei", "微软雅黑", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', x+20, dy+22);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(x+3, dy+3, 34, 6);
  }

  // 短暂受击闪光：从白色高亮逐帧淡出
  if (flash > 0) {
    ctx.globalAlpha = Math.min(0.75, flash / 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, dy, 40, 40);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawGoomba(x, y, frame, squished) {
  if (squished) {
    ctx.fillStyle = '#8b5a2b';
    ctx.beginPath();
    ctx.ellipse(x+16, y+28, 16, 6, 0, 0, Math.PI*2);
    ctx.fill();
    return;
  }
  ctx.fillStyle = '#8b4513';
  ctx.beginPath();
  ctx.ellipse(x+16, y+18, 16, 14, 0, 0, Math.PI*2);
  ctx.fill();
  const foot = Math.floor(frame)%2===0 ? 0 : 4;
  ctx.fillStyle = '#5a2d0c';
  ctx.fillRect(x+2, y+26, 12, 6+foot);
  ctx.fillRect(x+18, y+26, 12, 6-foot);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x+10, y+14, 5, 0, Math.PI*2);
  ctx.arc(x+22, y+14, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x+11, y+15, 2.5, 0, Math.PI*2);
  ctx.arc(x+23, y+15, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+6, y+9); ctx.lineTo(x+14, y+12);
  ctx.moveTo(x+26, y+9); ctx.lineTo(x+18, y+12);
  ctx.stroke();
}

function drawPipe(x, y, w, h) {

  ctx.strokeStyle = th.pipeEdge;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, 20);
  ctx.strokeRect(x+4, y+16, w-8, h-16);

}

function drawFlag() {
  const px = flag.x - cameraX;
  ctx.fillStyle = '#ccc';
  ctx.fillRect(px + 14, GROUND_Y - flag.poleH, 6, flag.poleH);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(px + 17, GROUND_Y - flag.poleH - 6, 8, 0, Math.PI*2);
  ctx.fill();
  const fy = GROUND_Y - flag.poleH + flag.flagY;
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(px + 20, fy);
  ctx.lineTo(px + 20 + 40, fy + 15);
  ctx.lineTo(px + 20, fy + 30);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + 32, fy + 15, 6, 0, Math.PI*2);
  ctx.fill();
}

function drawPits(){
  const th = levelData.theme;
  for(const p of pits){
    const x=p.x-cameraX;
    ctx.fillStyle=th.pit;
    ctx.fillRect(x,GROUND_Y,p.w,H-GROUND_Y);
    for(let i=0;i<p.w;i+=16){ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(x+i,GROUND_Y+10+(i%20),8,3);}
    if(th.pitGlow){   // 熔岩关：坑内岩浆发光涌动
      const g=ctx.createLinearGradient(0,GROUND_Y,0,H);
      g.addColorStop(0,'rgba(255,220,80,0.95)');
      g.addColorStop(1,'rgba(200,40,10,0.2)');
      ctx.fillStyle=g;
      const wob=Math.sin(levelFrame*0.08+p.x)*3;
      ctx.fillRect(x,GROUND_Y+2+wob,p.w,H-GROUND_Y);
    }
  }
}

// 旋转金币（可收集 +50）
function drawCoin(sx, sy){
  const t=levelFrame*0.12+sx*0.02;
  const wob=Math.abs(Math.cos(t));
  const w=6+16*wob;
  ctx.fillStyle='#f0a500';
  ctx.beginPath(); ctx.ellipse(sx,sy,Math.max(2,w/2),14,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#b47500'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#ffe98a';
  if(w>12)ctx.fillRect(sx-2,sy-8,4,16);
}

// 移动平台
function drawPlatform(p){

  if(x+p.w<0||x>W)return;
  ctx.fillStyle='#3d465a'; ctx.fillRect(x,p.y,p.w,p.h);

  ctx.fillStyle='#ffd700';
  ctx.fillRect(x+4,p.y+7,5,5); ctx.fillRect(x+p.w-9,p.y+7,5,5);

}

function drawBackground() {
  const th = levelData.theme;   // 每关天空 / 远山 / 地面配色都不同
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, th.sky1);
  grd.addColorStop(1, th.sky2);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  if (th.dark) {   // 暗色关卡：满天繁星
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) {
      const sx2 = ((i * 197 - cameraX * 0.08) % W + W) % W;
      const sy2 = (i * 83) % 280;
      ctx.globalAlpha = 0.3 + ((i * 37) % 60) / 100;
      ctx.fillRect(sx2, sy2, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  if (th.snow) {   // 冰雪关：飘雪
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 50; i++) {
      const sx2 = ((i * 173 + Math.sin((levelFrame + i * 30) * 0.02) * 40 - cameraX * 0.15) % W + W) % W;
      const sy2 = ((i * 97 + levelFrame * (1 + (i % 3) * 0.4)) % GROUND_Y);
      ctx.fillRect(sx2, sy2, 3, 3);
    }
  }
  ctx.fillStyle = th.dark ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 6; i++) {
    // 正确取模：旧写法在 cameraX 增大后取到负数，云会凭空消失/闪现，造成画面跳动
    const CLOUD_SPAN = W + 200;
    const cx = (((i * 400 - cameraX * 0.3) % CLOUD_SPAN) + CLOUD_SPAN) % CLOUD_SPAN - 100;
    const cy = 60 + (i % 3) * 40;
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI*2);
    ctx.arc(cx+30, cy-10, 24, 0, Math.PI*2);
    ctx.arc(cx+55, cy, 26, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = th.hill;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let i = 0; i < 12; i++) {
    // 山高以 3 座为周期（600px），取模周期必须一致，否则每滑 200px 全部山峰会瞬间“变高”一次
    const mx = i * 200 - (cameraX * 0.15 % 600);
    ctx.lineTo(mx + 100, GROUND_Y - 80 - (i%3)*20);
    ctx.lineTo(mx + 200, GROUND_Y);
  }
  ctx.lineTo(W, GROUND_Y);
  ctx.fill();
  ctx.fillStyle = th.hill2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let i = 0; i < 16; i++) {
    const mx = i * 150 - (cameraX * 0.25 % 450);
    ctx.lineTo(mx + 75, GROUND_Y - 46 - (i%2)*14);
    ctx.lineTo(mx + 150, GROUND_Y);
  }
  ctx.lineTo(W, GROUND_Y);
  ctx.fill();
  ctx.fillStyle = th.ground;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = th.groundLine;
  ctx.fillRect(0, GROUND_Y, W, 8);
  ctx.fillStyle = th.grass;
  ctx.fillRect(0, GROUND_Y - 6, W, 6);
  ctx.fillStyle = th.groundTop;
  for (let i = 0; i < W; i += 80) {
    ctx.fillRect(i - (cameraX % 80), GROUND_Y + 16, 46, 8);
  }
}

function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function addFloatText(x, y, text) {
  floatingTexts.push({ x, y, text, life: 70, vy: -1.8 });
}

function addParticles(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x, y, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7 - 3,
      life: 35, color
    });
  }
}

function triggerQuestionHit(q) {
  q.hit = true;
  q.bump = 8;
  q.flash = 8;
}

// ========== 强化后的轴分离碰撞 + 可靠顶问号 ==========
function resolveSolidCollisions() {
  const solids = [...bricks, ...questions, ...pipes];
  mario.standingPlat = null;   // 移动平台立足点每帧重新判定

  // 保存移动前的位置，用“穿越底边”判断是否真的从下方顶到方块。
  const prevX = mario.x;
  const prevY = mario.y;
  const prevBottom = prevY + mario.h;

  // 1. 水平移动 + 水平碰撞
  mario.x += mario.vx;
  for (const s of solids) {
    if (!rectsCollide(mario, s)) continue;

    if (mario.vx > 0) {
      mario.x = s.x - mario.w;
      mario.vx = 0;
    } else if (mario.vx < 0) {
      mario.x = s.x + s.w;
      mario.vx = 0;
    }
  }

  // 2. 垂直移动
  mario.y += mario.vy;
  mario.onGround = false;

  // 关键修复：
  // 问号块可能和砖块在水平方向重叠（例如 x=360 的问号与 x=340 的砖块），
  // 如果先处理砖块，砖块会把马里奥挡住，导致问号永远收不到“顶到”事件。
  // 所以先独立检测“向上穿过问号块底边”的事件。
  if (mario.vy < 0) {
    for (const q of questions) {
      const horizontallyOverlapping =
        mario.x < q.x + q.w && mario.x + mario.w > q.x;

      // 前一帧马里奥底部在问号块底边以下/附近，
      // 当前帧已经进入问号块范围 => 明确是从下方顶到。
      const crossedBottom =
        prevBottom <= q.y + q.h + 2 &&
        prevBottom >= q.y + q.h - 12 &&
        mario.y < q.y + q.h;

      // 再加一个更宽松的“当前帧穿越底边”判断，避免高速/边缘情况下漏判。
      const crossedThrough =
        prevBottom >= q.y + q.h - 2 &&
        mario.y <= q.y + q.h &&
        prevY > q.y + q.h - mario.h;

      if (horizontallyOverlapping && (crossedBottom || crossedThrough)) {
        mario.y = q.y + q.h;
        mario.vy = 0;

        if (!q.hit) {
          triggerQuestionHit(q);
          const lucky = Math.random() < 0.15;   // 15% 概率触发幸运方块 +500
          const pts = lucky ? 500 : 100;
          score += pts;
          document.getElementById('scoreText').textContent = score;

          // 金色飞字、粒子、音效：三者同时触发
          addFloatText(q.x + q.w / 2 - cameraX, q.y - 25, lucky ? '+500 ★' : '+100');
          addParticles(q.x + q.w / 2, q.y + 10, lucky ? '#ff4081' : '#ffd700');
          playCoin();
        }

        // 已经处理了本次向上碰撞，不再让其它实体重复改变垂直位置。
        return;
      }
    }
  }

  // 3. 普通实体垂直碰撞（砖块、管道，以及已经变成棕色的问号块）
  for (const s of solids) {
    if (!rectsCollide(mario, s)) continue;

    if (mario.vy >= 0) {
      // 从上方落下
      if (prevBottom <= s.y + 4) {
        mario.y = s.y - mario.h;
        mario.vy = 0;
        mario.onGround = true;
      }
    } else {
      // 向上撞到普通实体的底部
      if (prevBottom >= s.y + s.h - 8) {
        mario.y = s.y + s.h;
        mario.vy = 0;
      }
    }
  }

  // 地面 / 坑洞支撑判定。
  // 旧逻辑只看“身体中心点”是否悬空：跳坑时落点偏差 1px 就直接坠亡，且坠亡线
  // 只低于地面 8px（而下落速度高达 18px/帧），几乎没有任何容错。
  // 现改为“双脚支撑”：任一只脚（身体左右各内缩 5px）踩到实地即可站稳；
  // 下落中若只低于地面 LEDGE_SNAP 像素，会自动“扒住坑沿”弹回地面。
  const footL = mario.x + 5;
  const footR = mario.x + mario.w - 5;
  const overPit = pits.some(p => footL >= p.x && footR <= p.x + p.w);
  if (!overPit && mario.y + mario.h >= GROUND_Y) {
    if (mario.vy <= 0 || mario.y + mario.h <= GROUND_Y + LEDGE_SNAP) {
      mario.y = GROUND_Y - mario.h; mario.vy=0; mario.onGround=true;
    }
  }

  // 移动平台（单向碰撞：从上方落下可站稳，并随平台一起移动）
  for (const p of platforms) {
    if (mario.vy >= 0 && prevBottom <= p.y + 10 &&
        mario.x + mario.w > p.x + 2 && mario.x < p.x + p.w - 2 &&
        mario.y + mario.h >= p.y && mario.y + mario.h <= p.y + p.h + 16) {
      mario.y = p.y - mario.h;
      mario.vy = 0;
      mario.onGround = true;
      mario.standingPlat = p;
    }
  }
}

function updateFPS(){fpsFrames++;const now=performance.now();if(now-fpsLastTime>=500){fpsValue=Math.round(fpsFrames*1000/(now-fpsLastTime));fpsFrames=0;fpsLastTime=now;document.getElementById('fpsCounter').textContent=`${I18N[currentLang].fps} ${String(fpsValue).padStart(2,'0')}`;}}

function update() {
  if (gameState !== 'playing' && gameState !== 'flagAnim') return;

  // 移动平台：先动平台，站在上面的马里奥被一起带动
  for (const p of platforms) {
    const px0 = p.x;
    p.t += p.speed;
    p.x = p.baseX + Math.sin(p.t) * p.range - p.w / 2;
    if (mario.standingPlat === p) mario.x += p.x - px0;
  }
  levelFrame++;   // 关卡内帧计数（横幅 / 金币旋转 / 岩浆消动）

  // 输入
  let speed = keys['Shift'] ? RUN_SPEED : MOVE_SPEED;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
    mario.vx = -speed;
    mario.facing = -1;
  } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
    mario.vx = speed;
    mario.facing = 1;
  } else {
    mario.vx *= 0.78;
    if (Math.abs(mario.vx) < 0.25) mario.vx = 0;
  }

  // 跳跃（加速时更高）。
  // 支持土狼时间（刚走出坑沿仍可补跳）与跳跃预输入（提前按键，落地即跳），
  // 解决“起跳时机过严、跳坑必死”的手感问题。
  const wantJump = keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W'] || jumpBufferTimer > 0;
  if (wantJump && (mario.onGround || coyoteTimer > 0) && gameState === 'playing') {
    const isRunning = keys['Shift'] || Math.abs(mario.vx) > MOVE_SPEED + 0.5;
    mario.vy = isRunning ? JUMP_FORCE_RUN : JUMP_FORCE;
    mario.onGround = false;
    coyoteTimer = 0;
    jumpBufferTimer = 0;
    playJump();
  }

  // 重力
  mario.vy += GRAVITY;
  if (mario.vy > 18) mario.vy = 18;

  // 边界
  if (mario.x < 0) { mario.x = 0; mario.vx = 0; }
  if (mario.x > levelData.width - mario.w) { mario.x = levelData.width - mario.w; mario.vx = 0; }

  // 碰撞（含顶问号）
  resolveSolidCollisions();

  // 土狼时间 / 跳跃预输入计时
  if (mario.onGround) coyoteTimer = COYOTE_FRAMES;
  else if (coyoteTimer > 0) coyoteTimer--;
  if (jumpBufferTimer > 0) jumpBufferTimer--;

  // V5 敌人 AI：遇到实体障碍物转向，并在坑边提前掉头。
  const enemySolids = [...bricks, ...questions, ...pipes];
  for (const e of enemies) {
    if (!e.alive) continue;
    e.turnCooldown=Math.max(0,e.turnCooldown-1);
    const aheadX=e.x+e.w/2+Math.sign(e.vx)*12;
    if (pits.some(p=>aheadX>p.x && aheadX<p.x+p.w) && e.turnCooldown===0){e.vx=-Math.sign(e.vx)*levelData.enemySpeed;e.turnCooldown=12;}
    const nx=e.x+e.vx, nr={x:nx,y:e.y,w:e.w,h:e.h}; let blocked=false;
    if(nx<40){e.x=40;e.vx=Math.abs(e.vx);blocked=true;} else if(nx>levelData.width-e.w-40){e.x=levelData.width-e.w-40;e.vx=-Math.abs(e.vx);blocked=true;}
    if(!blocked) for(const s of enemySolids){if(rectsCollide(nr,s)){if(e.vx>0){e.x=s.x-e.w-1;e.vx=-Math.abs(e.vx);}else{e.x=s.x+s.w+1;e.vx=Math.abs(e.vx);}e.turnCooldown=10;blocked=true;break;}}
    if(!blocked)e.x=nx; e.frame+=.15;
    if(!e.squished && rectsCollide(mario,e)){
      const fromAbove=mario.vy>0 && mario.y+mario.h-e.y<20;
      if(fromAbove){e.squished=true;e.alive=false;mario.y=e.y-mario.h;mario.vy=-10;score+=200;document.getElementById('scoreText').textContent=score;addFloatText(e.x-cameraX,e.y-20,'+200');addParticles(e.x+16,e.y+12,'#f5d76e');playStomp();}
      else if(mario.invincible<=0){lives--;document.getElementById('livesText').textContent=lives;playHurt();addParticles(mario.x+16,mario.y+24,'#e52521');mario.invincible=90;mario.vy=-11;mario.vx=-mario.facing*4;if(lives<=0){gameState='fail';document.getElementById('failScore').textContent=score;document.getElementById('failScreen').classList.remove('hidden');document.getElementById('hud').classList.add('hidden');}}
    }
  }
  // 掉坑判死：低于地面超过 24px（旧为 8px，过于苛刻），先给“扒边”一次机会
  if(gameState==='playing' && mario.y+mario.h>GROUND_Y+24){
    lives--;document.getElementById('livesText').textContent=lives;playHurt();
    if(lives<=0){gameState='fail';document.getElementById('failScore').textContent=score;document.getElementById('failScreen').classList.remove('hidden');document.getElementById('hud').classList.add('hidden');}
    else{
      // 重生点回退并避开坑沿（至少留 26px 助跑距离），防止“落地即再掉坑”；
      // 镜头改为平滑跟随，重生时画面不再瞬间回跳 120px 造成“晃荡”感
      let rx=Math.max(40,mario.x-120);
      const nearPitEdge=(px)=>pits.some(p=>px+mario.w+26>p.x&&px<p.x+p.w+26);
      while(rx>40&&nearPitEdge(rx))rx-=16;
      mario.x=rx;mario.y=GROUND_Y-mario.h;mario.vx=0;mario.vy=0;
      coyoteTimer=0;jumpBufferTimer=0;
      mario.invincible=60;  // 重生短暂闪烁无敌，避免被坑边巡逻的板栗仔秒撞
    }
  }

  // 旗杆
  if (gameState === 'playing' && mario.x + mario.w > flag.x && mario.x < flag.x + 30) {
    gameState = 'flagAnim';
    mario.vx = 0;
    const touchHeight = GROUND_Y - (mario.y + mario.h);
    if (!flagScoreGiven) {
      flagScoreGiven = true;
      if (touchHeight >= flag.poleH - 25) {
        score += 400;
        addFloatText(flag.x - cameraX, mario.y - 30, '+400');
        marioOnFlag = true;
      } else if (touchHeight >= flag.poleH / 2) {
        score += 200;
        addFloatText(flag.x - cameraX, mario.y - 30, '+200');
      }
      document.getElementById('scoreText').textContent = score;
      playFlag();
    }
    flag.falling = true;
  }

  if (flag.falling) {
    flag.flagY += 3.8;
    if (flag.flagY >= flag.poleH - 30) {
      flag.flagY = flag.poleH - 30;
      flag.falling = false;
      if (marioOnFlag) mario.y = GROUND_Y - mario.h;
      spawnFireworks(flag.x, GROUND_Y - flag.poleH);   // 夺旗烟花庆祝
      setTimeout(() => {
        if (gameState !== 'flagAnim') return;  // 被暂停/重开打断则不再结算
        if (currentLevel >= levels.length) {
          gameState = 'win';
          document.getElementById('winScore').textContent = score;
          document.getElementById('winScreen').classList.remove('hidden');
          document.getElementById('hud').classList.add('hidden');
        } else {
          gameState = 'levelClear';
          const lucky = 50 * (2 + Math.floor(Math.random() * 9));   // 过关惊喜奖励 100~500
          score += lucky;
          document.getElementById('scoreText').textContent = score;
          document.getElementById('clearScore').textContent = score;
          document.getElementById('clearMsg').textContent = I18N[currentLang].clearMsg(currentLevel);
          document.getElementById('luckyMsg').textContent = I18N[currentLang].lucky + lucky;
          document.getElementById('levelClearScreen').classList.remove('hidden');
          document.getElementById('hud').classList.add('hidden');
          spawnConfetti();
        }
      }, 700);
    }
    if (marioOnFlag && flag.falling) {
      const targetY = GROUND_Y - flag.poleH + flag.flagY + 18;
      if (mario.y < targetY) mario.y += 3.8;
    }
  }

  // 平滑跟随镜头：掉坑重生、突然变速时画面不再来回猛跳（配合远山/云视差修复，消除“晃荡”感）
  const camTarget = Math.max(0, Math.min(mario.x - W * 0.35, levelData.width - W));
  cameraX += (camTarget - cameraX) * 0.2;
  if (Math.abs(camTarget - cameraX) < 0.3) cameraX = camTarget;

  mario.animTimer += Math.abs(mario.vx) > 0.4 ? 0.28 : 0;
  mario.frame = mario.animTimer;
  if (mario.invincible > 0) mario.invincible--;

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
    return p.life > 0;
  });
  floatingTexts = floatingTexts.filter(t => {
    t.y += t.vy; t.life--;
    return t.life > 0;
  });

  // 问号块“被顶起 8px → 回弹”，并同步淡出受击闪光
  for (const q of questions) {
    if (q.bump > 0) {
      q.bump -= 1.6;
      if (q.bump < 0) q.bump = 0;
    }
    if (q.flash > 0) q.flash -= 1;
  }

  // 金币收集（+50，坑上弧线 / 砖阵上方散落）
  for (const c of coins) {
    if (c.taken) continue;
    if (rectsCollide(mario, {x:c.x-14, y:c.y-14, w:28, h:28})) {
      c.taken = true;
      score += 50;
      document.getElementById('scoreText').textContent = score;
      addFloatText(c.x - cameraX, c.y - 18, '+50');
      addParticles(c.x, c.y, '#ffd700');
      playCoin();
    }
  }
}

function draw() {
  drawBackground();
  drawPits();
  for (const b of bricks) drawBrick(b.x - cameraX, b.y);
  for (const q of questions) drawQuestion(q.x - cameraX, q.y, q.hit, q.bump, q.flash);
  for (const p of pipes) drawPipe(p.x - cameraX, p.y, p.w, p.h);
  for (const p of platforms) drawPlatform(p);
  for (const c of coins) { if (!c.taken) drawCoin(c.x - cameraX, c.y); }
  for (const e of enemies) {
    if (e.alive || (e.squished && e.squishTimer > 0)) drawGoomba(e.x - cameraX, e.y, e.frame, e.squished);
  }
  drawFlag();
  drawLevelIntro();

  if (mario.invincible <= 0 || Math.floor(mario.invincible / 4) % 2 === 0) {
    // 静止不动时保持站立姿势，走路 / 跳跃才有动画
    const pose = !mario.onGround ? 'jump' : (Math.abs(mario.vx) > 0.4 ? 'walk' : 'idle');
    drawMario(mario.x - cameraX, mario.y, mario.facing, mario.frame, pose);
  }

  for (const p of particles) {
    ctx.globalAlpha = p.life / 35;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cameraX, p.y, 6, 6);
  }
  ctx.globalAlpha = 1;

  ctx.font = 'bold 24px "Microsoft YaHei", "微软雅黑", sans-serif';
  ctx.textAlign = 'center';
  for (const t of floatingTexts) {
    ctx.globalAlpha = Math.min(1, t.life / 40);
    ctx.fillStyle = '#ffd700';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function loop() {
  syncCtrlButtons();
  updateFPS();
  update();
  if (gameState === 'playing' || gameState === 'flagAnim') draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  // 跳跃预输入：按下瞬间缓存（长按不重复计数），落地帧自动起跳
  if (!e.repeat && [' ', 'ArrowUp', 'w', 'W'].includes(e.key)) jumpBufferTimer = JUMP_BUFFER_FRAMES;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  if (e.key === 'Enter') {
    if (gameState === 'start') document.getElementById('startBtn').click();
    else if (gameState === 'paused') document.getElementById('btnResume').click();
    else if (gameState === 'levelClear') document.getElementById('nextBtn').click();
    else if (gameState === 'fail') document.getElementById('retryBtn').click();
    else if (gameState === 'win') document.getElementById('winRestartBtn').click();
  }
  if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

document.getElementById('startBtn').onclick = () => {
  score = 0; lives = 3;
  initLevel(1);
  gameState = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  ensureAudio();
};
document.getElementById('nextBtn').onclick = () => {
  document.getElementById('levelClearScreen').classList.add('hidden');
  keys = {};
  initLevel(currentLevel + 1);
  gameState = 'playing';
  document.getElementById('hud').classList.remove('hidden');
};
document.getElementById('retryBtn').onclick = () => {
  document.getElementById('failScreen').classList.add('hidden');
  keys = {};
  lives = 3;
  initLevel(currentLevel);
  gameState = 'playing';
  document.getElementById('hud').classList.remove('hidden');
};
document.getElementById('restartBtn').onclick = () => {
  document.getElementById('failScreen').classList.add('hidden');
  keys = {};
  score = 0; lives = 3;
  initLevel(1);
  gameState = 'playing';
  document.getElementById('hud').classList.remove('hidden');
};
document.getElementById('winRestartBtn').onclick = () => {
  document.getElementById('winScreen').classList.add('hidden');
  keys = {};
  score = 0; lives = 3;
  initLevel(1);
  gameState = 'playing';
  document.getElementById('hud').classList.remove('hidden');
};
applyLanguage();
loop();
</script>
